server {
    listen 80;
    server_name your-domain.com;   # 替换为你的域名或服务器 IP

    client_max_body_size 20M;      # 与 Flask MAX_CONTENT_LENGTH 对齐

    # 静态文件直接由 Nginx 提供，不走 Gunicorn
    location /static/ {
        alias /root/exam-system-online/app/static/;
        expires 7d;
    }

    location /uploads/images/ {
        alias /root/exam-system-online/uploads/images/;
        expires 7d;
    }

    # 其余所有请求转发给 Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # AI 出题最长等待（异步改造后可降低）
    }
}
